[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlcoding"
version = "3.0.2"
description = "ControlCoding CLI and local governance framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Stefano Tonello" },
]
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp"]
dashboard = ["gradio"]
studio = ["gradio"]
visual = ["pyautogui"]
vision = ["pyautogui"]
semantic = []

[project.scripts]
cc = "cc:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
  "cc",
  "cc_layout",
  "cc_layout_cli",
  "cc_external",
  "cc_external_boundary",
  "cc_evidence",
  "cc_evidence_inputs",
  "cc_evidence_process",
  "cc_memory",
  "cc_project_map_model",
  "cc_project_map_sources",
  "cc_project_map_snapshots",
  "cc_setup",
  "cc_setup_service",
  "cc_feature",
  "cc_development",
  "cc_product",
  "cc_product_evolution",
  "cc_product_cli",
  "cc_product_documents",
  "cc_product_adoption",
  "cc_product_planning",
  "cc_product_progress",
  "cc_product_progress_contract",
  "cc_product_progress_observation",
  "cc_planning",
  "cc_planning_cli",
  "cc_development_archive",
  "cc_development_store",
  "cc_development_history",
  "cc_development_compatibility",
  "cc_development_migration",
  "cc_development_sessions",
  "cc_development_bundle",
  "cc_development_adapters",
  "cc_development_jobs",
  "cc_development_eval",
  "cc_development_execution",
  "cc_development_gateway",
  "cc_development_codex",
  "cc_development_release",
  "cc_development_github",
  "cc_development_operations",
  "cc_development_diagnosis",
  "cc_docs",
  "cc_review",
  "cc_init_module",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["cc_memory_lib*", "cc_development_lib*"]

[tool.setuptools.package-data]
cc_development_lib = ["*.json"]
